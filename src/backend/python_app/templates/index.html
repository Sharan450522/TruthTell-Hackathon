<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fake News Detection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.6.1/dist/socket.io.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <style>
    .transcription-container { max-height: clamp(200px, 50vh, 400px); overflow-y: auto; scroll-behavior: smooth; }
    .news-container { max-height: clamp(300px, calc(100vh - 4rem), 600px); overflow-y: auto; scroll-behavior: smooth; }
    .confidence-chart { height: clamp(200px, 40vh, 300px); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="container mx-auto px-4 py-6">
    <h1 class="text-3xl font-bold text-center mb-8">Fake News Detection</h1>
    <div class="flex flex-col lg:flex-row gap-6">
      <div class="w-full lg:w-2/3 space-y-6">
        <div class="bg-white rounded-xl shadow p-6">
          <form id="transcriptionForm" class="space-y-4">
            <div class="grid gap-4">
              <div>
                <label for="videoType" class="block text-sm font-medium text-gray-700 mb-2">Content Type</label>
                <select id="videoType" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500">
                  <option value="recorded">Recorded Video (URL)</option>
                  <option value="live">Live Stream</option>
                  <option value="text">Text Analysis</option>
                  <option value="article">Article URL</option>
                  <option value="media">Audio/Video File</option>
                </select>
              </div>
            </div>
            <div id="urlContainer">
              <label for="videoUrl" class="block text-sm font-medium text-gray-700">Video URL</label>
              <input type="text" id="videoUrl" placeholder="Enter video URL" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" />
            </div>
            <div id="textContainer" class="hidden">
              <label for="textInput" class="block text-sm font-medium text-gray-700">Text for Analysis</label>
              <textarea id="textInput" placeholder="Enter text..." rows="4" class="w-full px-3 py-2 border rounded-md resize-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
            <div id="articleContainer" class="hidden">
              <label for="articleUrl" class="block text-sm font-medium text-gray-700">Article URL</label>
              <input type="url" id="articleUrl" placeholder="Enter article URL" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" />
            </div>
            <div id="videoFileContainer" class="hidden">
              <label for="videoFile" class="block text-sm font-medium text-gray-700">Select Media File (Audio/Video)</label>
              <input type="file" id="videoFile" accept="audio/*,video/mp4" class="w-full px-3 py-2 border rounded-md focus:ring-2 focus:ring-blue-500" />
            </div>
            <div class="flex gap-3">
              <button type="submit" id="startTranscription" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 flex items-center justify-center gap-2">
                <span id="startButtonText">Start Analysis</span>
              </button>
              <button type="button" id="stopTranscription" class="w-full bg-red-600 text-white py-3 px-4 rounded-md hover:bg-red-700 hidden flex items-center justify-center gap-2">Stop</button>
            </div>
          </form>
          <div id="loadingMessage" class="hidden mt-4 text-center text-yellow-600 flex items-center justify-center gap-2">
            <span id="loadingText">Processing...</span>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow p-6">
          <h2 class="text-lg font-semibold mb-4">Analysis Result:</h2>
          <div id="transcriptionResult" class="transcription-container bg-gray-50 rounded-md p-4 mb-6"></div>
          <div class="grid lg:grid-cols-2 gap-6">
            <div>
              <h3 class="text-lg font-semibold mb-2">Fact Check Result:</h3>
              <div id="factCheckResult" class="bg-gray-50 rounded-md p-4"></div>
            </div>
            <div>
              <h3 class="text-lg font-semibold mb-2">Confidence Analysis:</h3>
              <div id="confidenceChart" class="confidence-chart bg-gray-50 rounded-md"></div>
            </div>
          </div>
          <div id="resultSummaryContainer" class="mt-6 p-6 bg-white rounded-xl shadow-lg border border-gray-200">
            <h2 class="text-2xl font-bold mb-4 text-center">Analysis Summary</h2>
            <div id="resultSummary" class="space-y-4"></div>
          </div>
          <div id="videoFragments" class="mt-6 p-4 bg-gray-50 rounded-md">
            <h3 class="text-lg font-semibold mb-2">Extracted Frames:</h3>
            <div id="fragmentContainer" class="flex flex-wrap gap-2"></div>
          </div>
        </div>
      </div>
      <div class="w-full lg:w-1/3">
        <div class="bg-white rounded-xl shadow p-6 lg:sticky lg:top-4">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Trending News</h2>
            <button id="refreshNews" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">Refresh</button>
          </div>
          <div id="trendingNews" class="space-y-4 news-container"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const CONFIG = { API_URL: window.location.origin, ERROR_DISPLAY_DURATION: 5000 };
    function updateVideoFragments(fragments) {
      const container = document.getElementById('fragmentContainer');
      container.innerHTML = '';
      fragments.forEach(fragment => {
        const card = document.createElement('div');
        card.className = 'w-32 border rounded-md overflow-hidden shadow-sm bg-white p-1';
        const img = document.createElement('img');
        img.src = 'data:image/jpeg;base64,' + fragment;
        img.className = 'w-full h-full object-cover';
        card.appendChild(img);
        container.appendChild(card);
      });
    }
    const elements = {
      form: document.getElementById('transcriptionForm'),
      videoType: document.getElementById('videoType'),
      videoUrl: document.getElementById('videoUrl'),
      startButton: document.getElementById('startTranscription'),
      stopButton: document.getElementById('stopTranscription'),
      loadingMessage: document.getElementById('loadingMessage'),
      loadingText: document.getElementById('loadingText'),
      transcriptionResult: document.getElementById('transcriptionResult'),
      factCheckResult: document.getElementById('factCheckResult'),
      trendingNews: document.getElementById('trendingNews'),
      textInput: document.getElementById('textInput'),
      articleUrl: document.getElementById('articleUrl'),
      videoFileInput: document.getElementById('videoFile'),
      videoFileContainer: document.getElementById('videoFileContainer'),
      urlContainer: document.getElementById('urlContainer'),
      textContainer: document.getElementById('textContainer'),
      articleContainer: document.getElementById('articleContainer'),
      startButtonText: document.getElementById('startButtonText'),
      confidenceChart: document.getElementById('confidenceChart'),
      refreshNews: document.getElementById('refreshNews'),
      resultSummary: document.getElementById('resultSummary'),
      fragmentContainer: document.getElementById('fragmentContainer')
    };
    const socket = io(window.location.origin);
    socket.on('connect', () => console.log('Socket.IO connected'));
    socket.on('transcription', (data) => { UI.updateTranscription(data.text, true); if (data.analysis) UI.updateFactCheck(data.analysis); });
    socket.on('error', (data) => UI.showError(data.error));
    socket.on('status', (data) => UI.showLoading(true, data.message));
    socket.on('video_fragment', (data) => { if (data && data.fragment) UI.appendVideoFragment(data); });
    const API = {
      async analyzeRecordedVideo(videoUrl) { const response = await fetch(`${CONFIG.API_URL}/api/analyze-recorded-video`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ file_path: videoUrl, language: "en" }) }); if (!response.ok) throw new Error('Failed to analyze recorded video'); return response.json(); },
      async analyzeArticle(url) { const response = await fetch(`${CONFIG.API_URL}/api/analyze-article`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, language: "en" }) }); if (!response.ok) throw new Error('Failed to analyze article'); return response.json(); },
      async analyzeText(text) { const response = await fetch(`${CONFIG.API_URL}/api/analyze-text`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, language: "en" }) }); if (!response.ok) throw new Error('Failed to analyze text'); return response.json(); },
      async analyzeVideo(file) { const formData = new FormData(); formData.append('video', file); formData.append('language', "en"); const response = await fetch(`${CONFIG.API_URL}/api/analyze-video`, { method: 'POST', body: formData }); if (!response.ok) throw new Error('Failed to analyze video file'); return response.json(); },
      async analyzeMedia(file) { const formData = new FormData(); formData.append('media', file); const response = await fetch(`${CONFIG.API_URL}/api/analyze-media`, { method: 'POST', body: formData }); if (!response.ok) throw new Error('Failed to analyze media file'); return response.json(); },
      async fetchTrendingNews() { const response = await fetch(`${CONFIG.API_URL}/api/trending-news`); if (!response.ok) throw new Error('Failed to fetch news'); return response.json(); }
    };
    const TranscriptionManager = {
      async handleRecordedVideo(videoUrl) { UI.showLoading(true, 'Analyzing recorded video...'); try { const data = await API.analyzeRecordedVideo(videoUrl); UI.updateTranscription(data.transcript); UI.updateFactCheck(data.video_summary.analysis); UI.updateResultSummary(data.video_summary); updateVideoFragments(data.video_summary.video_fragments); UI.showLoading(false); } catch (error) { UI.showError(error.message); UI.showLoading(false); } },
      startLive(videoUrl) { socket.emit('start_live', { url: videoUrl, language: "en" }); elements.stopButton.classList.remove('hidden'); elements.startButton.classList.add('hidden'); },
      stopLive() { socket.emit('stop_live'); elements.stopButton.classList.add('hidden'); elements.startButton.classList.remove('hidden'); },
      async handleArticleAnalysis(url) { UI.showLoading(true); try { const data = await API.analyzeArticle(url); UI.updateTranscription(data.text); UI.updateFactCheck(data.analysis); } catch (error) { UI.showError(error.message); } },
      async handleTextAnalysis(text) { UI.showLoading(true); try { const data = await API.analyzeText(text); UI.updateTranscription(data.text); UI.updateFactCheck(data.analysis); } catch (error) { UI.showError(error.message); } },
      async handleMediaAnalysis(file) {
        UI.showLoading(true, 'Analyzing media file...');
        try {
          const data = await API.analyzeMedia(file);
          if (data.media_type === 'audio') {
            UI.updateTranscription(data.transcript);
            UI.updateFactCheck(data.analysis);
            UI.updateResultSummary({ transcript: data.transcript, analysis: data.analysis, num_frames_extracted: 0 });
          } else {
            UI.updateTranscription(data.transcript);
            UI.updateFactCheck(data.video_summary.analysis);
            UI.updateResultSummary(data.video_summary);
            updateVideoFragments(data.video_summary.video_fragments);
          }
          UI.showLoading(false);
        } catch (error) {
          UI.showError(error.message);
          UI.showLoading(false);
        }
      }
    };
    const UI = {
      showError(message, duration = CONFIG.ERROR_DISPLAY_DURATION) { const errorDiv = document.createElement('div'); errorDiv.className = 'fixed bottom-4 right-4 bg-red-500 text-white px-4 py-2 rounded-lg shadow-lg'; errorDiv.textContent = message; document.body.appendChild(errorDiv); setTimeout(() => errorDiv.remove(), duration); },
      showLoading(show, message = 'Processing...') { elements.loadingMessage.classList.toggle('hidden', !show); elements.loadingText.textContent = message; elements.startButton.disabled = show; },
      updateTranscription(text, append = false) { if (append) { const p = document.createElement('p'); p.textContent = text; p.className = 'mb-2 p-2 bg-white rounded'; elements.transcriptionResult.appendChild(p); elements.transcriptionResult.scrollTop = elements.transcriptionResult.scrollHeight; } else { elements.transcriptionResult.innerHTML = `<p class="mb-2 p-2 bg-white rounded">${text}</p>`; } UI.showLoading(false); },
      updateFactCheck(analysis) { if (!analysis) return; const { confidence, prediction } = analysis; elements.factCheckResult.innerHTML = `<div class="p-4 rounded-lg ${confidence > 0.7 ? 'text-green-600 bg-green-50' : confidence > 0.5 ? 'text-yellow-600 bg-yellow-50' : 'text-red-600 bg-red-50'}"><div class="flex justify-between"><span>Credibility Score:</span><span>${(confidence * 100).toFixed(2)}%</span></div><div>Prediction: ${prediction}</div></div>`; UI.createConfidenceChart(confidence); },
      createConfidenceChart(confidence) { const data = [{ type: 'indicator', mode: 'gauge+number', value: confidence * 100, gauge: { axis: { range: [0, 100] }, bar: { color: `hsl(${confidence * 120}, 70%, 50%)` }, steps: [{ range: [0, 50], color: '#fee2e2' }, { range: [50, 70], color: '#fef3c7' }, { range: [70, 100], color: '#dcfce7' }] } }]; const layout = { width: elements.confidenceChart.offsetWidth, height: 250, margin: { t: 25, r: 25, l: 25, b: 25 } }; Plotly.newPlot(elements.confidenceChart, data, layout, { responsive: true, displayModeBar: false }); },
      appendVideoFragment(data) { const card = document.createElement('div'); card.className = 'w-32 border rounded-md overflow-hidden shadow-sm bg-white p-1'; const img = document.createElement('img'); img.src = 'data:image/jpeg;base64,' + data.fragment; img.className = 'w-full h-full object-cover'; const footer = document.createElement('div'); footer.className = 'text-xs text-gray-600 text-center mt-1'; footer.textContent = data.label ? data.label + ' - ' + new Date(data.timestamp).toLocaleTimeString() : new Date(data.timestamp).toLocaleTimeString(); card.appendChild(img); card.appendChild(footer); elements.fragmentContainer.appendChild(card); },
      updateResultSummary(result) {
        const container = elements.resultSummary; container.innerHTML = '';
        const createCard = (title, content) => { const card = document.createElement('div'); card.className = 'p-4 border rounded-md bg-gray-50 shadow-sm'; const cardTitle = document.createElement('h3'); cardTitle.className = 'font-semibold mb-2'; cardTitle.textContent = title; const cardContent = document.createElement('p'); cardContent.className = 'text-sm text-gray-700'; cardContent.innerHTML = content; card.appendChild(cardTitle); card.appendChild(cardContent); return card; };
        container.appendChild(createCard('Transcript', result.transcript || ''));
        if (result.ocr_text) container.appendChild(createCard('On-Screen Text (OCR)', result.ocr_text));
        if (result.avg_visual_feature) { const visualMean = (result.avg_visual_feature.reduce((a, b) => a + b, 0) / result.avg_visual_feature.length).toFixed(4); container.appendChild(createCard('Visual Feature Summary (mean)', visualMean)); }
        if (result.augmented_context) container.appendChild(createCard('Augmented Context', result.augmented_context));
        if (result.llm_inference) container.appendChild(createCard('Inference Explanation', result.llm_inference));
      },
      updateTrendingNews(data) {
        elements.trendingNews.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'p-4 border rounded-md bg-gray-50 shadow-sm';
          let credibilityHTML = '';
          if (item.analysis) {
            const score = (item.analysis.confidence * 100).toFixed(2);
            credibilityHTML = `<p class="text-xs text-gray-600">Credibility: ${score}% (${item.analysis.prediction})</p>`;
          }
          card.innerHTML = `<h3 class="font-semibold mb-1">${item.title}</h3><p class="text-xs text-gray-600 mb-1">${item.source} - ${item.published}</p><p class="text-sm text-gray-700">${item.description || item.summary || ''}</p>${credibilityHTML}`;
          elements.trendingNews.appendChild(card);
        });
      }
    };
    const EventHandlers = {
      handleVideoTypeChange(e) {
        const type = e.target.value;
        elements.urlContainer.classList.add('hidden');
        elements.textContainer.classList.add('hidden');
        elements.articleContainer.classList.add('hidden');
        elements.videoFileContainer.classList.add('hidden');
        if (type === 'text') { elements.textContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Analyze Text'; }
        else if (type === 'article') { elements.articleContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Analyze Article'; }
        else if (type === 'live') { elements.urlContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Start Live Transcription'; }
        else if (type === 'media') { elements.videoFileContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Analyze Media File'; }
        else if (type === 'recorded') { elements.urlContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Analyze Recorded Video'; }
        else { elements.urlContainer.classList.remove('hidden'); elements.startButtonText.textContent = 'Start Analysis'; }
        if (!elements.stopButton.classList.contains('hidden')) TranscriptionManager.stopLive();
      },
      async handleFormSubmit(e) {
        e.preventDefault();
        const videoType = elements.videoType.value;
        elements.transcriptionResult.innerHTML = '';
        elements.factCheckResult.innerHTML = '';
        Plotly.purge(elements.confidenceChart);
        elements.resultSummary.innerHTML = '';
        elements.fragmentContainer.innerHTML = '';
        if (videoType === 'recorded') TranscriptionManager.handleRecordedVideo(elements.videoUrl.value);
        else if (videoType === 'live') TranscriptionManager.startLive(elements.videoUrl.value);
        else if (videoType === 'text') TranscriptionManager.handleTextAnalysis(elements.textInput.value);
        else if (videoType === 'article') TranscriptionManager.handleArticleAnalysis(elements.articleUrl.value);
        else if (videoType === 'media') {
          const file = elements.videoFileInput.files[0];
          if (!file) { UI.showError('Please select a media file.'); return; }
          TranscriptionManager.handleMediaAnalysis(file);
        }
      },
      handleRefreshNews() { API.fetchTrendingNews().then(data => { UI.updateTrendingNews(data); }).catch(() => UI.showError('Failed to refresh news')); }
    };
    document.addEventListener('DOMContentLoaded', () => {
      elements.form.addEventListener('submit', EventHandlers.handleFormSubmit);
      elements.stopButton.addEventListener('click', TranscriptionManager.stopLive);
      elements.videoType.addEventListener('change', EventHandlers.handleVideoTypeChange);
      elements.refreshNews.addEventListener('click', EventHandlers.handleRefreshNews);
      API.fetchTrendingNews().then(data => UI.updateTrendingNews(data));
    });
  </script>
</body>
</html>
